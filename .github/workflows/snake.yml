name: Contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?palette=github-light&color_snake=#B08A16&color_dots=#efe5cf,#f3dc9a,#e3bc52,#b8862a,#7a1f2b
            dist/snake-dark.svg?palette=github-dark&color_snake=#E3BC52&color_dots=#161b22,#3b2f12,#7a5b16,#c99a2a,#e3bc52

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
